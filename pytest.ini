[pytest]
# `common` (services/) et `app` (services/<service>/) résolus comme en conteneur.
# Le package `app` existe dans chaque service → collision si plusieurs dossiers
# `services/<svc>` sont sur le pythonpath en même temps. On teste donc UN service
# par invocation. Par défaut : Restaurant (ci-dessous).
#
# Autre service : surcharger pythonpath + cible sur la ligne de commande, ex.
#   pytest services/paiement/tests -o "pythonpath=services services/paiement"
#   pytest services/commande/tests -o "pythonpath=services services/commande"
pythonpath = services services/restaurant
testpaths = services/restaurant/tests
